# Example bonsai configuration.
# Copy to /etc/bonsai/config.toml (or pass --config).

# Subdirectory inside each target where snapshots are stored.
snapshot_subdir = ".snapshots"

# IANA timezone; decides day/hour boundaries and how snapshots are named.
# Defaults to "UTC".
timezone = "Europe/Berlin"

[[target]]
path = "/spool/garage"
# hourly defaults to 0 (disabled); enable it only if the timer runs hourly.
retention = { hourly = 24, daily = 7, weekly = 4, monthly = 6, yearly = 1 }

[[target]]
path = "/spool/paperless"

[[target]]
path = "/spool/photos"
retention = { daily = 14, weekly = 4, monthly = 12, yearly = 2 }
