[package]
name = "bonsai"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Grandfather-father-son snapshot manager for bcachefs (snapper/sanoid-style)"
license = "AGPL-3.0-only"
repository = "https://github.com/elcattivo66/bonsai"
readme = "README.md"
default-run = "bonsai"

[features]
# Compiles the in-memory MockBcachefs backend; enabled for tests via the
# self dev-dependency below, never in release builds.
test-util = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
bonsai = { path = ".", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
