[package]
name = "bonsai"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Grandfather-father-son snapshot manager for bcachefs (snapper/sanoid-style)"
license = "AGPL-3.0-only"
repository = "https://github.com/elcattivo66/bonsai"
readme = "README.md"
default-run = "bonsai"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
